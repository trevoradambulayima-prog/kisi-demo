<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kisi : trouver un médicament dans les pharmacies de Kinshasa, commander et se faire livrer. Version de démonstration.">
<meta name="theme-color" content="#0b7a4b">
<link rel="icon" type="image/png" href="favicon.png">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Kisi Pharmacy Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Four desks behind tabs: buyer search, pharmacy, courier, admin. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#15211b; --muted:#5d6b63; --line:#d6ddd6;
  --accent:#0b7a4b; --accent-ink:#ffffff; --accent-soft:#dff0e6;
  --river:#cfe3ee; --river-ink:#4a7389;
  --ok:#0b7a4b; --ok-bg:#dff0e6; --warn:#8a5a00; --warn-bg:#fbeccb; --bad:#a3302a; --bad-bg:#f8dedb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --ink:#e8efea; --muted:#9aaba1; --line:#2c3a32;
  --accent:#4fc48b; --accent-ink:#06170e; --accent-soft:#17382a;
  --river:#16303d; --river-ink:#8fb9cd;
  --ok:#6fd6a2; --ok-bg:#17382a; --warn:#f0c268; --warn-bg:#3d2f10; --bad:#f29b94; --bad-bg:#43201d;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --ink:#e8efea; --muted:#9aaba1; --line:#2c3a32;
  --accent:#4fc48b; --accent-ink:#06170e; --accent-soft:#17382a;
  --river:#16303d; --river-ink:#8fb9cd;
  --ok:#6fd6a2; --ok-bg:#17382a; --warn:#f0c268; --warn-bg:#3d2f10; --bad:#f29b94; --bad-bg:#43201d;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font:700 26px/1 var(--display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.lang{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=search],input[type=number],input[type=time],input[type=tel],input[type=date],input[type=password]{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.lang select{width:auto;min-height:38px;padding:6px 10px}

.demo{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px}

.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}

.view{display:flex;flex-direction:column;gap:16px}
.search{display:flex;flex-direction:column;gap:10px}
.search label.big{font:700 20px/1.2 var(--display);text-wrap:balance}
.search input[type=search]{font-size:17px;min-height:52px;border-width:2px;border-color:var(--accent)}
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.filters select{flex:1 1 180px;width:auto}
.check{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}

.plan{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.plan figcaption{font-size:12px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.plan text{font:500 10px var(--body);fill:var(--muted)}
.plan .rv{fill:var(--river)} .plan .rvt{fill:var(--river-ink);font-style:italic}
.plan circle{fill:var(--line);stroke:var(--surface);stroke-width:2}
.plan circle.hit{fill:var(--accent)} .plan circle.miss{fill:var(--bad)}
#pick{cursor:crosshair;touch-action:manipulation}

.count{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2,.card h3{font:700 19px/1.2 var(--display);margin:0;text-wrap:balance}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.plain{color:var(--muted);border:1px solid var(--line)}
.meta{font-size:14px;color:var(--muted);margin:0}
.meta b{color:var(--ink);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone .num{font:600 17px var(--body);font-variant-numeric:tabular-nums;user-select:all}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.link{border:0;padding-inline:0;color:var(--accent);background:none}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.row .pr{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:12px}
.rx{font-size:11px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font:700 20px/1.2 var(--display);margin:0}
.panel h3{font:700 16px/1.2 var(--display);margin:6px 0 0}
.panel p{margin:0;color:var(--muted);font-size:14px}
.panel.hl{border-color:var(--accent);border-width:2px}
.sum{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.sum div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:700}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px}
.ord{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ord .head strong{font-variant-numeric:tabular-nums}
.ord .head{flex-wrap:wrap}
.ord .pill{white-space:normal;text-align:right}
.stack{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-s="in"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-s="low"]{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"][data-s="out"]{background:var(--bad-bg);color:var(--bad)}
.pricein{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pricein input{width:110px;min-height:38px;padding:6px 10px}
details>summary{cursor:pointer;font:700 20px/1.2 var(--display)}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
form.grid label:not(.check){display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.grid .full{grid-column:1/-1}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.arow:last-child{border-bottom:0}
.arow div{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subnav span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile small{color:var(--warn);font-size:12px;font-weight:600}
.foot{text-align:center}
.pricetxt{font-weight:600;font-variant-numeric:tabular-nums}
.prof{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px}
.prof img,.ph0{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:none}
.ph0{display:grid;place-items:center;background:var(--line);font:700 32px var(--display);color:var(--muted)}
.rate{display:flex;flex-direction:column;gap:2px}
.rate button{border:0;background:none;font-size:32px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 4px}
.rate div:hover button{color:var(--warn)} .rate div button:hover~button{color:var(--muted)}
.stars{color:var(--warn);letter-spacing:2px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;cursor:pointer}
.qty b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.telwrap{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.tel{display:flex;gap:6px}
.tel input:first-child{width:78px;flex:none;text-align:center;padding-inline:6px}
.tel input:last-child{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.tile.flat{cursor:default}
textarea{width:100%;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.me .who{flex:1 1 140px;min-width:0;display:flex;flex-direction:column}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line)}
.thumb{max-width:180px;border-radius:8px;border:1px solid var(--line)}
.idt{height:54px;border-radius:6px;border:1px solid var(--line);flex:none}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.roles button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.roles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.roles button:hover{border-color:var(--accent)}
.roles span{font-size:13px;color:var(--muted)}
input[type=file]{font-size:14px;max-width:100%}
@media (prefers-reduced-motion:no-preference){.btn,.chips button,.tabs button{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M8 1h6v7h7v6h-7v7H8v-7H1V8h7z" fill="var(--accent-ink)"/></svg></div>
      <div><h1>Kisi</h1><p data-i18n="tagline"></p></div>
    </div>
    <label class="lang"><span data-i18n="lang"></span>
      <select id="lang"><option value="fr">Français</option><option value="ln">Lingala</option><option value="sw">Kiswahili</option><option value="en">English</option></select>
    </label>
  </header>

  <div class="demo" data-i18n="demo"></div>

  <div class="me" id="mebar" hidden>
    <img class="avatar" id="me-photo" alt="" hidden>
    <div class="who"><b id="me-name"></b><span class="meta" id="me-role"></span></div>
    <span class="pill" id="me-ver"></span>
    <button class="btn" type="button" id="logout" data-i18n="logout"></button>
  </div>

  <!-- ACCOUNT: the page starts here -->
  <section class="view" id="auth">
    <div class="panel" id="signup">
      <div id="auth-backrow" hidden><button class="btn link" type="button" data-go="" style="gap:6px"><span aria-hidden="true">←</span><span data-i18n="back"></span></button></div>
      <h2 id="auth-title"></h2>
      <p id="auth-help" data-i18n="authHelp"></p>
      <div class="roles" id="roles">
        <button type="button" data-role="client" aria-pressed="true"><b data-i18n="role_client"></b><span data-i18n="roleClientD"></span></button>
        <button type="button" data-role="ph" aria-pressed="false"><b data-i18n="role_ph"></b><span data-i18n="rolePhD"></span></button>
        <button type="button" data-role="cr" aria-pressed="false"><b data-i18n="role_cr"></b><span data-i18n="roleCrD"></span></button>
      </div>
      <p class="meta" id="to-login"><span data-i18n="haveAcc"></span> <button class="btn link" type="button" data-go="connexion" data-i18n="loginBtn"></button></p>

      <form class="grid" id="acc-form" hidden>
        <label><span data-i18n="fullName"></span><input type="text" id="acc-name" data-cap required></label>
        <div class="telwrap"><span data-i18n="phoneNum"></span><div class="tel">
          <input type="text" id="acc-cc" data-cc value="+243" maxlength="5" inputmode="tel" required>
          <input type="tel" id="acc-phone" data-digits inputmode="numeric" maxlength="10" pattern="[0-9]{9,10}" placeholder="0812345678" required>
        </div></div>
        <label><span data-i18n="gender"></span><select id="acc-gender" required></select></label>
        <label><span data-i18n="dob"></span><input type="date" id="acc-dob" min="1900-01-01" required></label>
        <label><span data-i18n="pass"></span><input type="password" id="acc-pass" minlength="6" autocomplete="new-password" required></label>
        <label><span data-i18n="pass2"></span><input type="password" id="acc-pass2" minlength="6" autocomplete="new-password" required></label>
        <label><span data-i18n="idType"></span><select id="acc-idtype"></select></label>
        <label><span data-i18n="idFile"></span><input type="file" id="acc-idfile" accept="image/*" data-img="acc-id" required></label>
        <img class="thumb full" id="prev-acc-id" alt="" hidden>
        <div class="full"><button class="btn primary" type="submit" data-i18n="createAcc"></button></div>
      </form>

      <form class="grid" id="newph" hidden>
        <label class="full"><span data-i18n="name"></span><input type="text" id="ph-name" data-cap required></label>
        <label><span data-i18n="resp"></span><input type="text" id="ph-resp" data-cap required></label>
        <label><span data-i18n="lic"></span><input type="text" id="ph-lic" required></label>
        <div class="telwrap"><span data-i18n="phoneNum"></span><div class="tel">
          <input type="text" id="ph-cc" data-cc value="+243" maxlength="5" inputmode="tel" required>
          <input type="tel" id="ph-phone" data-digits inputmode="numeric" maxlength="10" pattern="[0-9]{9,10}" placeholder="0812345678" required>
        </div></div>
        <label><span data-i18n="communeL"></span><select id="ph-commune" required></select></label>
        <label class="full"><span data-i18n="addressFull"></span><input type="text" id="ph-address" data-cap1 required></label>
        <div class="full stack">
          <span class="meta"><b data-i18n="locTitle"></b> · <span id="pickpos">—</span></span>
          <figure class="plan"><svg id="pick" viewBox="0 0 400 260" role="img" aria-label="Kinshasa"></svg><figcaption data-i18n="locHelp"></figcaption></figure>
        </div>
        <label><span data-i18n="opens"></span><input type="time" id="ph-open" value="08:00"></label>
        <label><span data-i18n="closes"></span><input type="time" id="ph-close" value="20:00"></label>
        <label class="check full"><input type="checkbox" id="ph-24"><span data-i18n="h24"></span></label>
        <label class="check full"><input type="checkbox" id="ph-del"><span data-i18n="offerDel"></span></label>
        <label><span data-i18n="pass"></span><input type="password" id="ph-pass" minlength="6" autocomplete="new-password" required></label>
        <label><span data-i18n="pass2"></span><input type="password" id="ph-pass2" minlength="6" autocomplete="new-password" required></label>
        <label><span data-i18n="idType"></span><select id="ph-idtype"></select></label>
        <label><span data-i18n="idResp"></span><input type="file" id="ph-idfile" accept="image/*" data-img="ph-id" required></label>
        <img class="thumb full" id="prev-ph-id" alt="" hidden>
        <div class="full"><button class="btn primary" type="submit" data-i18n="savePh"></button></div>
      </form>

      <form class="grid" id="newcr" hidden>
        <label><span data-i18n="fullName"></span><input type="text" id="cr-name" data-cap required></label>
        <div class="telwrap"><span data-i18n="phoneNum"></span><div class="tel">
          <input type="text" id="cr-cc" data-cc value="+243" maxlength="5" inputmode="tel" required>
          <input type="tel" id="cr-phone" data-digits inputmode="numeric" maxlength="10" pattern="[0-9]{9,10}" placeholder="0812345678" required>
        </div></div>
        <label><span data-i18n="gender"></span><select id="cr-gender" required></select></label>
        <label><span data-i18n="dob"></span><input type="date" id="cr-dob" min="1900-01-01" required></label>
        <label><span data-i18n="zone"></span><select id="cr-commune" required></select></label>
        <label><span data-i18n="vehicle"></span><select id="cr-vehicle"></select></label>
        <label><span data-i18n="pass"></span><input type="password" id="cr-pass" minlength="6" autocomplete="new-password" required></label>
        <label><span data-i18n="pass2"></span><input type="password" id="cr-pass2" minlength="6" autocomplete="new-password" required></label>
        <label><span data-i18n="idType"></span><select id="cr-idtype"></select></label>
        <label><span data-i18n="idFile"></span><input type="file" id="cr-idfile" accept="image/*" data-img="cr-id" required></label>
        <img class="thumb full" id="prev-cr-id" alt="" hidden>
        <label class="full"><span data-i18n="photo"></span><input type="file" id="cr-photofile" accept="image/*" data-img="cr-photo"></label>
        <img class="thumb full" id="prev-cr-photo" alt="" hidden>
        <p class="full meta" data-i18n="idNote"></p>
        <div class="full" id="cr-near"></div>
        <div class="full"><button class="btn primary" type="submit" data-i18n="register"></button></div>
      </form>

    <div class="panel" id="loginpanel" hidden>

  fr.onload=()=>{const im=new Image();im.onerror=()=>cb(null);
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      try{cb(c.toDataURL("image/jpeg",0.7))}catch(e){cb(null)}};
    im.src=fr.result};
  fr.readAsDataURL(file)}

      panel(tr("phConn")+" ("+S.ph.length+")",S.ph.slice().sort((a,b)=>a.commune.localeCompare(b.commune)).map(p=>'<div class="row"><div><b>'+esc(p.name)+"</b></div><span>"+esc(p.commune)+
        '</span><span class="pill '+(p.verified?"ok":"warn")+'">'+esc(tr(p.verified?"verified":"pendingV"))+"</span></div>").join(""));
  }
  if(adTab==="ph"){const cs=[...new Set(S.ph.map(p=>p.commune))].sort(), l=S.ph.filter(p=>!adPhC||p.commune===adPhC);
    h=panel(tr("adPh")+" ("+l.length+")",'<select id="ad-phc" data-phc aria-label="Commune"><option value="">'+esc(tr("allCommunes"))+"</option>"+
      cs.map(c=>"<option"+(c===adPhC?" selected":"")+">"+esc(c)+"</option>").join("")+"</select>"+l.map(phL).join(""))}
  if(adTab==="cr")h=panel(tr("adCr"),S.cr.length?S.cr.map(crL).join(""):'<div class="empty">'+esc(tr("noCr"))+"</div>");
  if(adTab==="us")h=panel(tr("adUs"),S.us.map(usL).join(""));
  if(adTab==="od"){
    const fl={all:()=>true,way:o=>o.delivery&&o.status==="picked",recv:o=>o.delivery&&["received","done"].includes(o.status)}, l=S.od.filter(fl[adOdF]).sort(byNew);
    h='<div class="panel"><h2>'+esc(tr("adOd"))+'</h2><div class="chips">'+[["all","fAll"],["way","fWay"],["recv","fRecv"]].map(a=>'<button type="button" data-odf="'+a[0]+
      '" aria-pressed="'+(adOdF===a[0])+'">'+esc(tr(a[1]))+" ("+S.od.filter(fl[a[0]]).length+")</button>").join("")+'</div><div class="stack">'+(l.length?l.map(o=>orderCard(o,"admin")).join(""):none)+"</div></div>";
  }
  if(adTab==="prod")h=panel(tr("adCat"),S.pr.map(r=>'<div class="arow"><div><b>'+esc(r.name)+"</b>"+(r.rx?'<span class="rx">Rx</span>':"")+'<br><span class="meta">'+
    esc(tr("stockedAt",{l:S.ph.filter(p=>S.st[p.id]&&S.st[p.id][r.id]&&S.st[p.id][r.id].s!=="out").map(p=>p.name+" ("+p.commune+")").join(", ")||tr("none")}))+"<br>"+
    esc(tr("onDeliv",{n:S.od.filter(o=>orderItems(o).some(i=>i.r===r.id)&&o.delivery&&["confirmed","picked"].includes(o.status)).length}))+'</span></div><span class="pricetxt">'+money(r.base)+"</span></div>").join(""));
  $("adview").innerHTML=h;
}

// order status changes (pharmacy confirms or declines, courier accepts or delivers)
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-ost]"), ac=e.target.closest("[data-accept]"), vf=e.target.closest("[data-verify]");
  if(st){const o=S.od.find(x=>x.id===st.dataset.o);if(o){o.status=st.dataset.ost;(o.log=o.log||{})[o.status]=Date.now();save();renderMyOrders();renderPh();renderCr();toast(stLabel(o))}}
  const oe=e.target.closest("[data-oedit]"), oc=e.target.closest("[data-ocancel]");
  if(oe){const o=S.od.find(x=>x.id===oe.dataset.oedit);if(o&&o.status==="pending")openOrder(o.ph,o)}
  if(oc){const o=S.od.find(x=>x.id===oc.dataset.ocancel), u=me();
    if(o&&u&&o.user===u.id&&o.status==="pending"){
      if(cancelArm!==o.id){cancelArm=o.id;renderMyOrders()}
      else{cancelArm=null;o.status="cancelled";(o.log=o.log||{}).cancelled=Date.now();if(orderEdit===o.id){orderEdit=null;orderPh=null;cart=[];$("order").hidden=true}
        save();renderMyOrders();renderPh();toast(stLabel(o))}}}
  const pfb=e.target.closest("[data-prof]"), rt=e.target.closest("[data-rate]");
  if(pfb){const id=pfb.dataset.prof;openProf.has(id)?openProf.delete(id):openProf.add(id);renderMyOrders()}
  if(rt){const o=S.od.find(x=>x.id===rt.dataset.o), u=me();
    if(o&&u&&o.user===u.id&&!o.rating&&["received","done"].includes(o.status)){o.rating=+rt.dataset.rate;save();renderMyOrders();toast(tr("thanksRate"))}}
  const rq=e.target.closest("[data-req]"), lk=e.target.closest("[data-link]");
  if(rq){const w=who();if(w&&w.role==="cr"&&w.x.verified&&!link(w.x.id,rq.dataset.req)){S.links.push({cr:w.x.id,ph:rq.dataset.req,status:"pending"});save();renderCr();toast(tr("reqSent"))}}
  if(lk){const w=who(), c=cour(lk.dataset.cr);if(w&&w.role==="ph"&&c){const l=link(c.id,w.x.id), a=lk.dataset.link;
    if(l&&a==="remove")S.links.splice(S.links.indexOf(l),1);
    else if(l&&(a==="refused"||c.verified))l.status=a;
    save();renderPh();toast(tr("saved"))}}
  if(ac){const o=S.od.find(x=>x.id===ac.dataset.accept), c=cour($("mcr").value);
    if(o&&c&&c.verified&&o.status==="confirmed"&&!o.courier&&(link(c.id,o.ph)||{}).status==="accepted"){o.status="picked";o.courier=c.id;(o.log=o.log||{}).picked=Date.now();save();renderMyOrders();renderPh();renderCr();toast(tr("st_picked"))}}
  if(vf){const k=vf.dataset.verify, x=(k==="ph"?S.ph:k==="cr"?S.cr:S.us).find(a=>a.id===vf.dataset.id);if(x){x.verified=!x.verified;save();renderAll()}}
});
